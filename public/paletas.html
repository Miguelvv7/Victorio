<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paletas — Elige la tuya</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#111; color:#fff; font-family: 'Helvetica Neue', sans-serif; padding:2rem; }
  h1 { text-align:center; font-size:1.1rem; letter-spacing:.3em; text-transform:uppercase; margin-bottom:2.5rem; opacity:.5; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:1.5rem; }
  .card {
    border-radius:12px; overflow:hidden; cursor:pointer;
    transition:transform .2s, box-shadow .2s;
    border: 2px solid transparent;
  }
  .card:hover { transform:translateY(-4px); box-shadow:0 20px 40px rgba(0,0,0,.4); }
  .card.selected { border-color:#fff; }
  .preview {
    height:180px; display:flex; flex-direction:column;
    justify-content:center; padding:1.5rem;
    position:relative; overflow:hidden;
  }
  .preview-title {
    font-size:2rem; font-weight:800; text-transform:uppercase;
    letter-spacing:-.03em; line-height:.9; margin-bottom:.6rem;
  }
  .preview-badge {
    display:inline-block; padding:.2em .7em;
    font-size:.7rem; font-weight:700; text-transform:uppercase;
    letter-spacing:.1em;
  }
  .preview-dot {
    width:8px; height:8px; border-radius:50%;
    position:absolute; top:1rem; right:1rem;
  }
  .card-info { padding:1rem 1.2rem; }
  .card-name { font-size:.85rem; font-weight:600; margin-bottom:.25rem; }
  .card-desc { font-size:.72rem; opacity:.5; line-height:1.4; }
  .swatches { display:flex; gap:.4rem; margin-top:.6rem; }
  .swatch { width:20px; height:20px; border-radius:4px; }
  .btn-pick {
    display:block; width:100%; margin-top:.8rem; padding:.5rem;
    text-align:center; font-size:.7rem; letter-spacing:.15em;
    text-transform:uppercase; border:none; border-radius:6px;
    cursor:pointer; font-weight:700; transition:opacity .15s;
  }
  .btn-pick:hover { opacity:.8; }
</style>
</head>
<body>
<h1>Elige tu paleta</h1>
<div class="grid" id="grid"></div>

<script>
const palettes = [
  {
    id:1, name:"Noche Profunda + Esmeralda",
    desc:"El clásico oscuro elevado. Verde que da vida sin gritar.",
    bg:"#0f1a12", text:"#f0ede8", accent:"#10b981", surface:"#162018"
  },
  {
    id:2, name:"Carbón + Blanco Puro",
    desc:"Máxima legibilidad. Minimalismo radical.",
    bg:"#141414", text:"#ffffff", accent:"#ffffff", surface:"#1e1e1e"
  },
  {
    id:3, name:"Azul Noche + Eléctrico",
    desc:"Tecnológico, europeo. Como un dashboard premium.",
    bg:"#050d1a", text:"#e8f0fe", accent:"#3b82f6", surface:"#0d1f3c"
  },
  {
    id:4, name:"Negro + Dorado",
    desc:"Lujo silencioso. Para clientes de alto valor.",
    bg:"#0a0a0a", text:"#f5f0e8", accent:"#d4a853", surface:"#161410"
  },
  {
    id:5, name:"Pizarra + Coral",
    desc:"Oscuro pero cálido. Diferente a todos los portfolios.",
    bg:"#1a1014", text:"#f5ede8", accent:"#f97316", surface:"#241820"
  },
  {
    id:6, name:"Verde Bosque + Crema",
    desc:"Orgánico, natural. Bien para clientes de comercio local.",
    bg:"#0d1f0f", text:"#f2ede4", accent:"#84cc16", surface:"#152317"
  },
  {
    id:7, name:"Morado Profundo + Rosa",
    desc:"Creativo, audaz. Llama la atención de inmediato.",
    bg:"#0f0520", text:"#f5e8ff", accent:"#e879f9", surface:"#1a0a30"
  },
  {
    id:8, name:"Crema + Negro (modo claro)",
    desc:"Editorial, sofisticado. Muy diferente a todos.",
    bg:"#f5f0e8", text:"#0c0c0b", accent:"#0c0c0b", surface:"#ede8de"
  },
  {
    id:9, name:"Blanco Roto + Índigo",
    desc:"Moderno, limpio. Transmite orden y profesionalidad.",
    bg:"#f8f7f4", text:"#1a1a2e", accent:"#4f46e5", surface:"#ede9e0"
  },
  {
    id:10, name:"Negro + Rojo Oscuro (original)",
    desc:"Tu paleta actual. Intensa, de impacto directo.",
    bg:"#0c0c0b", text:"#f0ede8", accent:"#a01830", surface:"#161614"
  },
  {
    id:11, name:"Gris Frío + Cyan",
    desc:"Tecnológico y frío. Comunica precisión.",
    bg:"#0a0f14", text:"#e0f7fa", accent:"#06b6d4", surface:"#111923"
  },
  {
    id:12, name:"Marrón Oscuro + Naranja Quemado",
    desc:"Tierra, calidez. Diferente y memorable.",
    bg:"#1a0f08", text:"#f5ece3", accent:"#ea580c", surface:"#241810"
  },
  {
    id:13, name:"Marino + Amarillo",
    desc:"Contraste máximo. Energía y confianza.",
    bg:"#0a1628", text:"#fffbeb", accent:"#eab308", surface:"#0f1e38"
  },
  {
    id:14, name:"Negro Humo + Verde Lima",
    desc:"Hacker vibes. Para posicionarte como dev técnico.",
    bg:"#0d0d0d", text:"#f0f0e8", accent:"#a3e635", surface:"#171717"
  },
  {
    id:15, name:"Gris Cálido + Terracota",
    desc:"Artesanal, premium. Para clientes de interiorismo.",
    bg:"#1a1510", text:"#f0e8de", accent:"#c2603c", surface:"#241e18"
  },
  {
    id:16, name:"Azul Medianoche + Blanco",
    desc:"Corporativo elevado. Serio pero moderno.",
    bg:"#0c1829", text:"#f0f4ff", accent:"#60a5fa", surface:"#162035"
  },
  {
    id:17, name:"Negro + Violeta Neón",
    desc:"Audaz, creativo, no apto para todos — pero los que les gusta, flipan.",
    bg:"#0a0010", text:"#f5e8ff", accent:"#8b5cf6", surface:"#120020"
  },
  {
    id:18, name:"Gris Oscuro + Rojo Carmesí",
    desc:"Más frío que el original. El rojo destaca más.",
    bg:"#111214", text:"#f0ede8", accent:"#dc2626", surface:"#1a1c1f"
  },
  {
    id:19, name:"Café + Crema (modo cálido)",
    desc:"Artesanal, boutique. Para negocios con personalidad.",
    bg:"#1c1008", text:"#f5ece0", accent:"#d97706", surface:"#281808"
  },
  {
    id:20, name:"Pizarra Azulada + Menta",
    desc:"Fresco, moderno, tranquilo. Transmite fiabilidad.",
    bg:"#0e1a20", text:"#e8f5f0", accent:"#34d399", surface:"#162028"
  },
  {
    id:21, name:"Negro Absoluto + Blanco + Rojo",
    desc:"Newspaper. El más agresivo y editorial de todos.",
    bg:"#000000", text:"#ffffff", accent:"#ef4444", surface:"#111111"
  },
  {
    id:22, name:"Verde Militar + Beige",
    desc:"Robusto, confiable. Transmite que haces las cosas bien.",
    bg:"#1a2010", text:"#f0ead8", accent:"#65a30d", surface:"#222c18"
  },
  {
    id:23, name:"Índigo + Oro Suave",
    desc:"Artístico, premium. Para posicionarte en el segmento alto.",
    bg:"#0d0824", text:"#f0ede8", accent:"#c4a35a", surface:"#170f35"
  },
];

const grid = document.getElementById('grid');

palettes.forEach(p => {
  const isLight = p.bg.startsWith('#f') || p.bg.startsWith('#e') || p.bg.startsWith('#d') || p.bg === '#f8f7f4';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="preview" style="background:${p.bg}">
      <div class="preview-dot" style="background:${p.accent}"></div>
      <div class="preview-title" style="color:${p.text}">
        DESARROLLO<br>WEB
      </div>
      <div class="preview-badge" style="background:${p.accent};color:${isLight ? '#fff' : p.bg}">
        QUE VENDE
      </div>
    </div>
    <div class="card-info" style="background:${p.surface}">
      <div class="card-name" style="color:${p.text}">${p.name}</div>
      <div class="card-desc" style="color:${p.text}">${p.desc}</div>
      <div class="swatches">
        <div class="swatch" style="background:${p.bg};border:1px solid rgba(255,255,255,.15)" title="Fondo"></div>
        <div class="swatch" style="background:${p.text}" title="Texto"></div>
        <div class="swatch" style="background:${p.accent}" title="Acento"></div>
      </div>
      <button class="btn-pick" data-id="${p.id}"
        style="background:${p.accent};color:${isLight ? '#fff' : p.bg}">
        ELEGIR ESTA →
      </button>
    </div>
  `;
  grid.appendChild(card);
});

document.getElementById('grid').addEventListener('click', e => {
  const btn = e.target.closest('.btn-pick');
  if (!btn) return;
  const id = btn.dataset.id;
  const p = palettes.find(x => x.id == id);
  document.querySelectorAll('.card').forEach(c => c.classList.remove('selected'));
  btn.closest('.card').classList.add('selected');

  const msg = `Paleta elegida: "${p.name}"\n\nFondo: ${p.bg}\nTexto: ${p.text}\nAcento: ${p.accent}`;
  alert(msg);
});
</script>
</body>
</html>
